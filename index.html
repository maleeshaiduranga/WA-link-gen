<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Link Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b141a 0%, #075e54 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --text-muted: #aebac1;
            --wa-green: #25d366;
            --wa-hover: #20ba5a;
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #e5ddd5 0%, #dcf8c6 100%);
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-color: #111b21;
            --text-muted: #667781;
            --wa-green: #075e54;
            --wa-hover: #128c7e;
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            transition: background 0.5s ease, color 0.3s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Animated Green Blobs */
        .ambient-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            background: rgba(37, 211, 102, 0.2);
            filter: blur(80px);
            border-radius: 50%;
            animation: float 12s infinite alternate ease-in-out;
        }

        .blob1 { width: 300px; height: 300px; top: 10%; left: -50px; }
        .blob2 { width: 400px; height: 400px; bottom: 10%; right: -100px; animation-delay: 2s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        /* Header / Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 600;
        }

        .logo i {
            color: #25d366;
            font-size: 1.8rem;
        }

        /* iOS Liquid Theme Theme Switcher */
        .theme-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            box-shadow: var(--glass-shadow);
        }

        /* Main Container */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--glass-shadow);
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Custom Dropdown Search style */
        .dropdown-container {
            position: relative;
        }

        .search-select {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }
        [data-theme="light"] .search-select {
            background: rgba(0, 0, 0, 0.04);
        }

        .dropdown-list {
            position: absolute;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            margin-top: 5px;
            z-index: 10;
            display: none;
            box-shadow: var(--glass-shadow);
        }

        .dropdown-search {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.1);
            border: none;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-color);
            outline: none;
        }

        .dropdown-item {
            padding: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        .dropdown-item:hover {
            background: rgba(37, 211, 102, 0.2);
        }

        input[type="tel"], textarea {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }
        [data-theme="light"] input[type="tel"], [data-theme="light"] textarea {
            background: rgba(0, 0, 0, 0.04);
        }

        input:focus, textarea:focus {
            border-color: #25d366;
        }

        /* iOS Liquid Button Effect */
        .btn-generate {
            width: 100%;
            padding: 16px;
            background: var(--wa-green);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transform: scale(1);
            transition: transform 0.1s ease;
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        /* Result Section */
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-url {
            word-break: break-all;
            font-size: 0.9rem;
            margin-bottom: 12px;
            color: #25d366;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .action-btns button, .action-btns a {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.1);
            color: var(--text-color);
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass-border);
        }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            header { padding: 15px 20px; }
            .logo { font-size: 1.1rem; }
            .card { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
    </div>

    <header>
        <div class="logo">
            <i class="fab fa-whatsapp"></i>
            <span>WhatsApp Link Generator</span>
        </div>
        <button class="theme-btn" id="themeToggle">
            <i class="fas fa-moon"></i> <span>Dark</span>
        </button>
    </header>

    <main>
        <div class="card">
            <div class="input-group">
                <label>Country Code</label>
                <div class="dropdown-container">
                    <div class="search-select" id="selectedCountry">Loading Countries...</div>
                    <div class="dropdown-list" id="dropdownList">
                        <input type="text" class="dropdown-search" id="searchBar" placeholder="Search by name or code...">
                        <div id="optionsContainer"></div>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>WhatsApp Number (Without 0)</label>
                <input type="tel" id="phoneNumber" placeholder="771234567">
            </div>

            <div class="input-group">
                <label>Custom Message (Optional)</label>
                <textarea id="message" rows="4" placeholder="Hello! I'm interested in your service."></textarea>
            </div>

            <button class="btn-generate" onclick="generateLink()">Generate Link</button>

            <div class="result-box" id="resultBox">
                <label>Your Link is Ready:</label>
                <div class="result-url" id="generatedUrl"></div>
                <div class="action-btns">
                    <button onclick="copyLink()"><i class="far fa-copy"></i> Copy</button>
                    <a id="openLink" target="_blank"><i class="fas fa-external-link-alt"></i> Open</a>
                </div>
            </div>
        </div>
    </main>

<!-- Elfsight WhatsApp Chat | Untitled WhatsApp Chat -->
<script src="https://elfsightcdn.com/platform.js" async></script>
<div class="elfsight-app-935a907d-1070-4550-a3de-5aaa9a474383" data-elfsight-app-lazy></div>

    <footer>
        Made by ❤ © MS clicks • 2026 All rights reserved •
    </footer>

    <script>
        // Country API & Logic
        let countriesData = [];
        let selectedCode = "94"; 

        async function fetchCountries() {
            try {
                const response = await fetch('https://restcountries.com/v3.1/all?fields=name,idd');
                const data = await response.json();
                
                countriesData = data.map(c => {
                    let code = "";
                    if(c.idd.root) {
                        code = c.idd.root + (c.idd.suffixes ? c.idd.suffixes[0] : "");
                    }
                    return { name: c.name.common, code: code.replace('+', '') };
                }).filter(c => c.code !== "").sort((a,b) => a.name.localeCompare(b.name));

                setupDropdown();
            } catch (error) {
                document.getElementById('selectedCountry').innerText = "Sri Lanka (+94)";
            }
        }

        function setupDropdown() {
            const container = document.getElementById('optionsContainer');
            const selectedDiv = document.getElementById('selectedCountry');
            
            // Set Default Sri Lanka
            selectedDiv.innerText = "Sri Lanka (+94)";

            renderOptions(countriesData);

            selectedDiv.addEventListener('click', () => {
                const list = document.getElementById('dropdownList');
                list.style.display = list.style.display === 'block' ? 'none' : 'block';
                document.getElementById('searchBar').focus();
            });
        }

        function renderOptions(data) {
            const container = document.getElementById('optionsContainer');
            container.innerHTML = "";
            data.forEach(c => {
                const item = document.createElement('div');
                item.className = 'dropdown-item';
                item.innerHTML = `<span>${c.name}</span> <b>+${c.code}</b>`;
                item.onclick = () => {
                    selectedCode = c.code;
                    document.getElementById('selectedCountry').innerText = `${c.name} (+${c.code})`;
                    document.getElementById('dropdownList').style.display = 'none';
                };
                container.appendChild(item);
            });
        }

        // Search Filter
        document.getElementById('searchBar').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = countriesData.filter(c => 
                c.name.toLowerCase().includes(term) || c.code.includes(term)
            );
            renderOptions(filtered);
        });

        // Close dropdown on outside click
        window.addEventListener('click', (e) => {
            if (!document.querySelector('.dropdown-container').contains(e.target)) {
                document.getElementById('dropdownList').style.display = 'none';
            }
        });

        // Link Generation Logic
        function generateLink() {
            let num = document.getElementById('phoneNumber').value.trim();
            const msg = document.getElementById('message').value;

            // Remove leading zero if typed
            if(num.startsWith('0')) {
                num = num.substring(1);
            }

            if(!num) {
                alert("Please enter a phone number.");
                return;
            }

            const encodedMsg = encodeURIComponent(msg);
            const finalUrl = `https://wa.me/${selectedCode}${num}${msg ? '?text=' + encodedMsg : ''}`;

            document.getElementById('generatedUrl').innerText = finalUrl;
            document.getElementById('openLink').href = finalUrl;
            document.getElementById('resultBox').style.display = 'block';
        }

        function copyLink() {
            const urlText = document.getElementById('generatedUrl').innerText;
            navigator.clipboard.writeText(urlText);
            alert("Link copied to clipboard!");
        }

        // Theme Toggle Logic
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            
            themeToggle.innerHTML = newTheme === 'dark' ? 
                `<i class="fas fa-moon"></i> <span>Dark</span>` : 
                `<i class="fas fa-sun"></i> <span>Light</span>`;
        });

        // Initialize
        fetchCountries();
    </script>
</body>
</html>
